backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # EDIT THIS
  branch: main
  # If you use a custom domain, also add:  site_domain: yourdomain.com

media_folder: public/images
public_folder: /images

collections:
  - name: catalogue
    label: Website content
    files:
      - name: products
        label: Products
        file: src/content/products.json
        fields:
          - label: Products
            name: items
            widget: list
            label_singular: product
            summary: "{{fields.name}}"
            fields:
              - label: Category
                name: category
                widget: select
                options:
                  - {label: "Wooden Doors", value: "wooden-doors"}
                  - {label: "WPC Doors", value: "wpc-doors"}
                  - {label: "PVC Doors", value: "pvc-doors"}
                  - {label: "Plywood", value: "plywood"}
                  - {label: "Laminates", value: "laminates"}
                  - {label: "Door Handles", value: "door-handles"}
                  - {label: "Locks and Hinges", value: "locks-hinges"}
                  - {label: "Door Accessories", value: "door-accessories"}
                  - {label: "Interior Hardware", value: "interior-hardware"}
                  - {label: "Other Fittings", value: "other-fittings"}
              - {label: Product name, name: name, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: Photo, name: image, widget: image, required: false}
      - name: gallery
        label: Gallery
        file: src/content/gallery.json
        fields:
          - label: Gallery photos
            name: items
            widget: list
            label_singular: photo
            summary: "{{fields.label}}"
            fields:
              - {label: Caption, name: label, widget: string}
              - {label: Photo, name: image, widget: image, required: false}
              - {label: Style when no photo, name: kind, widget: select, options: [door, sheet, metal], default: door}
              - {label: Tone (0-5), name: tone, widget: number, default: 0, min: 0, max: 5}
